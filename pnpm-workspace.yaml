allowBuilds:
  '@parcel/watcher': true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.61.1'
  - '@typescript-eslint/parser@8.61.1'
  - '@typescript-eslint/project-service@8.61.1'
  - '@typescript-eslint/scope-manager@8.61.1'
  - '@typescript-eslint/tsconfig-utils@8.61.1'
  - '@typescript-eslint/type-utils@8.61.1'
  - '@typescript-eslint/types@8.61.1'
  - '@typescript-eslint/typescript-estree@8.61.1'
  - '@typescript-eslint/utils@8.61.1'
  - '@typescript-eslint/visitor-keys@8.61.1'
  - aws-cdk@2.1127.0
  - typescript-eslint@8.61.1
  - js-yaml@4.1.2
  - brace-expansion@5.0.8
  - '@orcabus/platform-cdk-constructs@1.9.3'
# NOTE: no sprintf-js override — the advisory (GHSA-hp3w-g68c-fv3c) is patched in
# 1.1.4, which is not yet published (highest available is 1.1.3). The override
# `sprintf-js@<=1.1.3: ^1.1.4` is unsatisfiable and breaks install/audit, so it is
# replaced by an audit exception below. Restore the override and drop the exception
# once sprintf-js 1.1.4 is released.
auditConfig:
  ignoreGhsas:
    # sprintf-js <=1.1.3 DoS via unbounded precision specifiers.
    # Patched in 1.1.4 (unreleased). Remove this exception when 1.1.4 ships and
    # add `sprintf-js@<=1.1.3: ^1.1.4` back to overrides above.
    - GHSA-hp3w-g68c-fv3c
overrides:
  glob@>=9.0.0 <=14.0.1: ^14.0.2
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
